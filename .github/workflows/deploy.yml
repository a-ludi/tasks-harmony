name: Deploy

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to deploy (e.g. v0.15.1, leave empty for latest)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      # NOTE: This job's deploy logic is mirrored in scripts/deploy-staging.sh.
      # Keep both files in sync when changing deploy steps.
      - uses: actions/checkout@v6

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            gh release download "$VERSION" --pattern 'dist.tar.gz'
          else
            gh release download --pattern 'dist.tar.gz'
          fi
          tar -xzf dist.tar.gz

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.SSH_PATH }}/"

  deploy-sync:
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      # NOTE: This job's deploy logic is mirrored in scripts/deploy-staging.sh.
      # Keep both files in sync when changing deploy steps.
      - uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy sync server
        env:
          SERVER_DIR: ${{ vars.SERVER_DIR }}
          SOCKET_DIR: ${{ vars.SOCKET_DIR }}
          NGINX_INCLUDE_DIR: ${{ vars.NGINX_INCLUDE_DIR }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          COUCHDB_USER: ${{ vars.COUCHDB_USER }}
          COUCHDB_PASSWORD: ${{ secrets.COUCHDB_PASSWORD }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          # Write server env file
          printf 'SOCKET_DIR=%s\nCOUCHDB_USER=%s\nCOUCHDB_PASSWORD=%s\nVAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=%s\n' \
            "$SOCKET_DIR" "$COUCHDB_USER" "$COUCHDB_PASSWORD" \
            "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT" \
            | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "cat > $SERVER_DIR/.env"

          # Sync compose config and server source
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.yml "$SSH_USER@$SSH_HOST:$SERVER_DIR/"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            sync-server/ "$SSH_USER@$SSH_HOST:$SERVER_DIR/sync-server/"
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            vapid-observer/ "$SSH_USER@$SSH_HOST:$SERVER_DIR/vapid-observer/"

          # Render and sync nginx location config
          perl -pe 's|__SOCKET_DIR__|$ENV{SOCKET_DIR}|g' nginx/sync-location.conf.template \
            | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
              "cat > $NGINX_INCLUDE_DIR/sync-location.conf"

          # Restart service and reload nginx
          # (systemd ExecStartPre rebuilds the Docker image before starting)
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "sudo systemctl restart tasks-harmony-sync && sudo nginx -s reload"
