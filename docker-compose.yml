version: '3.3'

services:
  sync:
    build: ./sync-server
    volumes:
      - ${SOCKET_DIR}:${SOCKET_DIR}
      - sync-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - SYNC_SOCKET=${SOCKET_DIR}/sync.sock
      - SYNC_BLOB_DIR=/data
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
    depends_on:
      - redis
      - couchdb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  couchdb-init:
    image: curlimages/curl:latest
    depends_on:
      - couchdb
    entrypoint: sh
    command:
      - -c
      - |
        curl -fs http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984/_up &&
        curl -s -X POST http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984/_cluster_setup \
          -H 'Content-Type: application/json' \
          -d '{"action":"enable_single_node","username":"${COUCHDB_USER}","password":"${COUCHDB_PASSWORD}","bind_address":"0.0.0.0","port":5984,"singlenode":true}' &&
        curl -s -X PUT http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984/_users &&
        curl -s -X PUT http://${COUCHDB_USER}:${COUCHDB_PASSWORD}@couchdb:5984/_replicator
    restart: on-failure

  vapid-observer:
    build: ./vapid-observer
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      POLL_INTERVAL_MS: 60000
    depends_on:
      - couchdb
    restart: unless-stopped

volumes:
  sync-data:
  redis-data:
  couchdb-data:
