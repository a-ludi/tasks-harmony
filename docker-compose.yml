version: '3.3'

services:
  sync:
    build: ./sync-server
    volumes:
      - ${SOCKET_DIR}:${SOCKET_DIR}
      - sync-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - SYNC_SOCKET=${SOCKET_DIR}/sync.sock
      - SYNC_BLOB_DIR=/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  sync-data:
  redis-data:
